name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy --ignore-missing-imports agents/ incident-normalizer/ memory/ || true

      - name: Run OPA policy tests
        run: |
          # Install OPA for policy testing
          curl -L -o opa https://openpolicyagent.org/downloads/v0.67.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/
          opa test policies/ -v

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --cov=agents --cov=incident-normalizer --cov=memory --cov-fail-under=50 --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -c .yamllint.yaml .
        continue-on-error: false

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          base: main
          head: HEAD

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-test, yaml-lint, secret-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sample-app image
        uses: docker/build-push-action@v5
        with:
          context: ./sample-app
          push: false
          load: true
          tags: sentinelops/sample-app:test

      - name: Build incident-normalizer image
        uses: docker/build-push-action@v5
        with:
          context: ./incident-normalizer
          push: false
          load: true
          tags: sentinelops/incident-normalizer:test

  integration-test:
    name: Integration Tests (Kind Cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-test, yaml-lint, secret-scan, build-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Create kind cluster
        run: |
          kind create cluster --name sentinelops --config infra/kind-config.yaml
          kubectl apply -f infra/namespaces.yaml

      - name: Load Docker images into kind
        run: |
          kind load docker-image sentinelops/sample-app:test --name sentinelops
          kind load docker-image sentinelops/incident-normalizer:test --name sentinelops

      - name: Deploy sample app
        run: |
          kubectl apply -f gitops/manifests/sample-app-deployment.yaml -n apps

      - name: Run integration tests
        run: |
          pytest tests/test_selfheal.py -v -s --timeout=300

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-and-test, yaml-lint, secret-scan, build-docker, integration-test]
    if: failure()

    steps:
      - name: Send failure notification
        run: |
          echo "CI/CD pipeline failed. Check GitHub Actions for details."
          # Add Slack/Discord/Email notification here if needed