extends: default
rules:
  line-length:
    max: 120
    level: warning
  document-start:
    present: false
    level: warning
    # Allow document start (---) for Kubernetes multi-document YAML files
    # These are required by kubectl for multi-resource manifests
  trailing-spaces:
    level: error
  empty-lines:
    max: 2
    level: warning
  indentation:
    spaces: 2
    level: error
  comments-indentation:
    level: warning
  key-duplicates:
    level: error
  braces:
    level: warning
  brackets:
    level: warning
  truthy:
    level: warning
  new-line-at-end-of-file:
    level: error
