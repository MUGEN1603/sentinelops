# chaos/experiments.yaml — LitmusChaos experiments for SentinelOps resilience validation
#
# Prerequisites:
#   1. Install LitmusChaos:
#      kubectl apply -f https://litmuschaos.github.io/litmus/litmus-2.12.0.yaml
#   2. Verify installation:
#      kubectl get pods -n litmus
#
# Apply experiments:
#   kubectl apply -f chaos/experiments.yaml
#
# Run an experiment:
#   kubectl annotate chaosengine sample-app-pod-kill chaosengine.litmuschaos.io/inject="true" --overwrite
#   OR use the LitmusChaos UI: kubectl port-forward -n litmus svc/litmusportal-frontend 9091:9091
#
# Monitor:
#   kubectl get chaosresults -n apps
#   kubectl logs -n litmus -l app=chaos-experiment

---
## Experiment 1: Pod Kill (validates self-heal via Argo CD)
## Kills the sample-app pod and verifies Argo CD restores it
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: sample-app-pod-kill
  namespace: apps
spec:
  appinfo:
    appns: apps
    applabel: "app=sample-app"
    appkind: deployment
  chaosServiceAccount: litmus-admin
  monitoring: true
  jobCleanUpPolicy: delete
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "30"
            - name: CHAOS_INTERVAL
              value: "10"
            - name: FORCE
              value: "false"
            - name: PODS_AFFECTED_PERC
              value: "100"

---
## Experiment 2: Container Kill (validates container restart)
## Kills the container inside the pod, Kubernetes restarts it
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: sample-app-container-kill
  namespace: apps
spec:
  appinfo:
    appns: apps
    applabel: "app=sample-app"
    appkind: deployment
  chaosServiceAccount: litmus-admin
  monitoring: true
  jobCleanUpPolicy: delete
  experiments:
    - name: container-kill
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "30"
            - name: CHAOS_INTERVAL
              value: "10"
            - name: CONTAINER_RUNTIME
              value: "containerd"
            - name: SOCKET_PATH
              value: "/run/containerd/containerd.sock"

