---
## Experiment 8: Node Drain (validates pod rescheduling)
## Drains the worker node to verify pod rescheduling on healthy node
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: sample-app-node-drain
  namespace: apps
spec:
  appinfo:
    appns: apps
    applabel: "app=sample-app"
    appkind: deployment
  chaosServiceAccount: litmus-admin
  monitoring: true
  jobCleanUpPolicy: delete
  experiments:
    - name: node-drain
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: NODE_LABEL
              value: "node-role.kubernetes.io/worker=true"

---
## ─────────────────────────────────────────────────────────────────────────────
## Validation Checklist for Each Experiment
## ─────────────────────────────────────────────────────────────────────────────
##
## For each experiment, verify:
## 1. ✅ Alert fires in Prometheus/AlertManager
## 2. ✅ Incident Normalizer receives webhook and enriches with logs/metrics
## 3. ✅ LangGraph pipeline completes (triage → diagnosis → remediation → policy)
## 4. ✅ OPA policy evaluates remediation (allow/deny with reasons)
## 5. ✅ If allowed: GitHub PR created with YAML patch
## 6. ✅ If denied: Slack notification sent (if configured)
## 7. ✅ Argo CD syncs the change (self-heal)
## 8. ✅ Cluster state matches Git (no drift)
## 9. ✅ Metrics/logs available in Grafana/Loki
## 10. ✅ RCA stored in Qdrant for future retrieval
##
## Run all experiments sequentially:
##   for exp in $(kubectl get chaosengine -n apps -o name | cut -d/ -f2); do
##     kubectl annotate chaosengine $exp chaosengine.litmuschaos.io/inject="true" --overwrite -n apps
##     sleep 180  # Wait for experiment + self-heal
##   done