## Experiment 6: Network Partition (validates network policies)
## Partitions the pod from Loki/Prometheus to verify resilience
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: sample-app-network-partition
  namespace: apps
spec:
  appinfo:
    appns: apps
    applabel: "app=sample-app"
    appkind: deployment
  chaosServiceAccount: litmus-admin
  monitoring: true
  jobCleanUpPolicy: delete
  experiments:
    - name: pod-network-partition
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: CHAOS_INTERVAL
              value: "10"
            - name: NETWORK_PARTITION_TYPE
              value: "egress"
            - name: DESTINATION_IPS
              value: "10.0.0.0/8"  # Block access to cluster services

