## Argo CD Application — SentinelOps GitOps Reconciler
##
## Apply: kubectl apply -f gitops/argocd-app.yaml
##
## selfHeal: true is MANDATORY.
## Without it, manual kubectl edit/scale drift is never corrected and the
## "Git is the only path to change" guarantee is false.
##
## BEFORE applying: replace SENTINELOPS_REPO_OWNER/REPO_NAME placeholders with
## your real GitHub owner/repo. The constants SENTINELOPS_REPO_OWNER and
## SENTINELOPS_REPO_NAME below are documentation-only — Argo CD does not do
## env substitution in raw Application manifests, so you MUST edit this file
## (or use Kustomize + envsubst / Argo CD ApplicationSet with cluster vars).
##
## Example final value:
##   repoURL: https://github.com/MUGEN1603/sentinelops.git

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinelops-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  # Source: watch the gitops/manifests/ directory on main branch
  source:
    # REPLACE with your real repo URL before `kubectl apply`.
    # Example: https://github.com/MUGEN1603/sentinelops.git
    repoURL: https://github.com/MUGEN1603/sentinelops.git
    targetRevision: main
    path: gitops/manifests

  # Destination: reconcile into the apps namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  # Sync policy
  syncPolicy:
    automated:
      prune: true        # Remove resources that are in the cluster but not in Git
      selfHeal: true     # MANDATORY: revert any manual drift on the live cluster
    syncOptions:
      - CreateNamespace=true        # Create the apps namespace if it doesn't exist
      - PrunePropagationPolicy=foreground
      - PruneLast=true              # Prune after all other resources are synced
      - ApplyOutOfSyncOnly=true     # Only apply resources that differ from Git

    # NOTE: We do NOT use ignoreDifferences on /spec/replicas. The repo does NOT
    # deploy an HPA, so /spec/replicas is owned exclusively by Git — Argo CD must
    # observe and correct manual `kubectl scale` drift. Adding ignoreDifferences
    # here would silently disable selfHeal for replica count, breaking the
    # test_selfheal.py validation.
