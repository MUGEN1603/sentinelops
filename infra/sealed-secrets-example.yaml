## infra/sealed-secrets-example.yaml — SealedSecret examples for GitOps-safe secret storage
##
## ╔══════════════════════════════════════════════════════════════════════════╗
## ║  Bitnami Sealed Secrets — Encrypt secrets client-side, store in Git       ║
## ╚══════════════════════════════════════════════════════════════════════════╝
##
## Prerequisites:
##   1. Install Sealed Secrets controller in cluster:
##        kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.28.0/controller.yaml
##   2. Install kubeseal CLI:
##        brew install kubeseal
##   3. Fetch the cluster's public cert:
##        kubeseal --fetch-cert --controller-name=sealed-secrets --controller-namespace=kube-system > pub-cert.pem
##
## To seal a secret:
##   kubectl create secret generic sentinelops-agent-secrets \
##     --from-literal=GITHUB_TOKEN=ghp_xxx \
##     --from-literal=SLACK_WEBHOOK_URL=https://hooks.slack.com/xxx \
##     --namespace=default \
--dry-run=client -o yaml \
##   | kubeseal --cert pub-cert.pem --namespace default \
##   > infra/sealed-sentinelops-agent-secrets.yaml
##
##   kubectl create secret generic grafana-admin-credentials \
##     --from-literal=admin-user=admin \
##     --from-literal=admin-password=$(openssl rand -base64 32) \
##     --namespace=observability \
--dry-run=client -o yaml \
##   | kubeseal --cert pub-cert.pem --namespace observability \
##   > infra/sealed-grafana-admin-credentials.yaml
##
##   kubectl create secret generic opa-auth-token \
##     --from-literal=OPA_BEARER_TOKEN=$(openssl rand -base64 32) \
##     --namespace=default \
--dry-run=client -o yaml \
##   | kubeseal --cert pub-cert.pem --namespace default \
##   > infra/sealed-opa-auth-token.yaml
##
## The resulting SealedSecret YAML files CAN BE COMMITTED TO GIT safely.
## Only the cluster with the matching private key can decrypt them.
##
## ─────────────────────────────────────────────────────────────────────────────
## EXAMPLE SealedSecret (DO NOT USE — generate your own with kubeseal):
## ─────────────────────────────────────────────────────────────────────────────

---
## Example: SealedSecret for sentinelops-agent-secrets
## Generated with: kubeseal --cert pub-cert.pem --namespace default < secret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sentinelops-agent-secrets
  namespace: default
  labels:
    managed-by: sentinelops
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    GITHUB_TOKEN: AgBy3iH... # ENCRYPTED - only cluster can decrypt
    GITHUB_REPO: AgBy3iH...
    SLACK_WEBHOOK_URL: AgBy3iH...
  template:
    metadata:
      name: sentinelops-agent-secrets
      namespace: default
      labels:
        managed-by: sentinelops
    type: Opaque
  # Optional: rotate every 30 days via GitHub Actions
  # lifecycle:
  #   rotation:
  #     enabled: true
  #     schedule: "0 0 * * 0" # weekly

---
## Example: SealedSecret for grafana-admin-credentials
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin-credentials
  namespace: observability
  labels:
    managed-by: sentinelops
spec:
  encryptedData:
    admin-user: AgBy3iH...
    admin-password: AgBy3iH... # 32-char base64, rotated quarterly
  template:
    metadata:
      name: grafana-admin-credentials
      namespace: observability
      labels:
        managed-by: sentinelops
        app: grafana
    type: Opaque

---
## Example: SealedSecret for OPA auth token
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: opa-auth-token
  namespace: default
  labels:
    managed-by: sentinelops
spec:
  encryptedData:
    OPA_BEARER_TOKEN: AgBy3iH...
  template:
    metadata:
      name: opa-auth-token
      namespace: default
      labels:
        managed-by: sentinelops
    type: Opaque

---
## ─────────────────────────────────────────────────────────────────────────────
## Usage with Argo CD (auto-sync sealed secrets):
## ─────────────────────────────────────────────────────────────────────────────
##
## 1. Commit the SealedSecret YAML files to gitops/manifests/sealed-secrets/
## 2. Add to argocd-app.yaml source path or create separate Application:
##
## apiVersion: argoproj.io/v1alpha1
## kind: Application
## metadata:
##   name: sentinelops-sealed-secrets
##   namespace: argocd
## spec:
##   project: default
##   source:
##     repoURL: https://github.com/MUGEN1603/sentinelops.git
##     targetRevision: main
##     path: gitops/manifests/sealed-secrets
##   destination:
##     server: https://kubernetes.default.svc
##     namespace: default
##   syncPolicy:
##     automated:
##       prune: true
##       selfHeal: true
##
## The Sealed Secrets controller will automatically decrypt and create
## the actual Secret resources when the SealedSecret is applied.
##
