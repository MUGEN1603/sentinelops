## infra/secrets.yaml — k8s Secret TEMPLATES for SentinelOps
##
## ╔══════════════════════════════════════════════════════════════════════════╗
## ║  WARNING: DO NOT COMMIT REAL VALUES INTO THIS FILE OR ANY FILE IN GIT.  ║
## ║  This file contains PLACEHOLDER values only.                            ║
## ║  Before applying:                                                        ║
## ║    1. Replace every <REPLACE_...> placeholder with the real value.       ║
## ║    2. Apply with: kubectl apply -f infra/secrets.yaml                    ║
## ║    3. Immediately delete the local copy or seal it with Sealed Secrets.  ║
## ║  RECOMMENDED: Use Bitnami Sealed Secrets or External Secrets Operator    ║
## ║  so encrypted secrets can be committed safely to Git.                    ║
## ╚══════════════════════════════════════════════════════════════════════════╝
##
## To create secrets without touching a file at all, use kubectl directly:
##   kubectl create secret generic sentinelops-agent-secrets \
##     --from-literal=GITHUB_TOKEN=<token> \
##     --from-literal=SLACK_WEBHOOK_URL=<url> \
##     --namespace=default
##
## GitHub Token recommendation:
##   Use a FINE-GRAINED PAT (not classic) scoped to ONLY the sentinelops repo:
##   - Settings → Developer settings → Fine-grained tokens
##   - Repository access: Only select repositories → sentinelops
##   - Permissions: Contents=Read/Write, Pull requests=Read/Write
##   - Expiry: 30 days (rotate monthly via CI or GitHub Actions secret rotation)
##   This limits blast radius to one repo if the agent is ever compromised
##   via prompt injection through malicious log lines.

---
## ── sentinelops-agent credentials ────────────────────────────────────────────
## Referenced by: agents/gitops_bridge.py (GITHUB_TOKEN, GITHUB_REPO)
##                agents/policy_review_agent.py (SLACK_WEBHOOK_URL)

apiVersion: v1
kind: Secret
metadata:
  name: sentinelops-agent-secrets
  namespace: default
  labels:
    managed-by: sentinelops
type: Opaque
stringData:
  GITHUB_TOKEN: "<REPLACE_WITH_FINE_GRAINED_PAT>"
  GITHUB_REPO: "<REPLACE_WITH_owner/sentinelops>"
  SLACK_WEBHOOK_URL: "<REPLACE_WITH_SLACK_WEBHOOK_OR_EMPTY_STRING>"

---
## ── Grafana admin password ────────────────────────────────────────────────────
## Referenced by: observability/prometheus-values.yaml (grafana.adminPassword)
## The Helm chart reads this secret via grafana.admin.existingSecret.
## Remove the hardcoded adminPassword from prometheus-values.yaml after creating this.

apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: observability
  labels:
    managed-by: sentinelops
    app: grafana
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "<REPLACE_WITH_STRONG_RANDOM_PASSWORD>"
  ## Generate a strong password: openssl rand -base64 32

---
## ── OPA auth token (optional, for production hardening) ─────────────────────
## OPA server in the current setup accepts unauthenticated requests (no --authn-* flags).
## In production, enable OPA's built-in auth with a bearer token:
##   docker run -d -p 8181:8181 openpolicyagent/opa run --server \
##     --authentication=token --authorization=basic --addr :8181
## Then store the token here and reference it in policy_review_agent.py.

apiVersion: v1
kind: Secret
metadata:
  name: opa-auth-token
  namespace: default
  labels:
    managed-by: sentinelops
type: Opaque
stringData:
  OPA_BEARER_TOKEN: "<REPLACE_WITH_OPA_BEARER_TOKEN_OR_LEAVE_EMPTY_FOR_LOCAL_DEV>"
