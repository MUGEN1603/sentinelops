## infra/tls-certificates.yaml — cert-manager TLS certificates for internal services
## Apply after cert-manager is installed: kubectl apply -f infra/tls-certificates.yaml
##
## Creates TLS certificates for:
##   - incident-normalizer (webhook server)
##   - Loki (log ingestion)
##   - Prometheus (metrics scrape)
##   - OPA (policy evaluation)
##   - AlertManager (webhook egress)

---
## Incident Normalizer TLS certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: incident-normalizer-tls
  namespace: default
spec:
  secretName: incident-normalizer-tls
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  subject:
    organizations:
      - SentinelOps
  commonName: incident-normalizer.default.svc.cluster.local
  dnsNames:
    - incident-normalizer.default.svc.cluster.local
    - incident-normalizer.default.svc
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: sentinelops-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth

