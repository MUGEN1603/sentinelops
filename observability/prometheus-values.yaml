## kube-prometheus-stack values for SentinelOps
## Ref: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

# ──────────────────────────────────────────────
# Prometheus configuration
# ──────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 24h
    # Enable the remote-write receiver so the OTel Collector can push
    # kubeletstats metrics to Prometheus via /api/v1/write. The OTel
    # collector's `prometheusremotewrite` exporter depends on this.
    enableRemoteWriteReceiver: true
    # Pick up PrometheusRule objects in ALL namespaces
    ruleNamespaceSelector: {}
    ruleSelector:
      matchLabels:
        release: kube-prometheus
    # Scrape ServiceMonitors in all namespaces
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

# ──────────────────────────────────────────────
# AlertManager — webhook receiver to Incident Normalizer
# ──────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace", "pod"]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      receiver: sentinelops-webhook
      routes:
        # Watchdog is a heartbeat alert — send to "null" (drop) receiver
        # to avoid spamming the incident normalizer with non-incident alerts.
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
    receivers:
      # "null" receiver — drops alerts silently. Required by the Watchdog route.
      - name: "null"
      - name: sentinelops-webhook
        webhook_configs:
          # When running incident-normalizer locally via port-forward,
          # replace with the actual accessible URL or k8s service URL.
          - url: "http://host.docker.internal:8000/webhook"
            send_resolved: true

# ──────────────────────────────────────────────
# Prometheus Operator — fix liveness probe timeouts
# The operator needs time to sync informer caches on startup;
# the default 30s (3 failures × 10s) is too aggressive for kind clusters.
# ──────────────────────────────────────────────
prometheusOperator:
  admissionWebhooks:
    enabled: true
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  livenessProbe:
    initialDelaySeconds: 60
    failureThreshold: 10
    timeoutSeconds: 5
  readinessProbe:
    initialDelaySeconds: 30
    failureThreshold: 10
    timeoutSeconds: 5

# ──────────────────────────────────────────────
# Grafana — enable with default dashboard
# ──────────────────────────────────────────────
# Grafana — enable with default dashboard
# ──────────────────────────────────────────────
# For production: create a Kubernetes Secret with the admin password and
# reference it via `grafana.admin.existingSecret` instead of hardcoding here.
# See infra/secrets.yaml (grafana-admin-credentials) for the Secret template.
grafana:
  enabled: true
  adminPassword: "sentinelops-admin"  # CHANGE THIS for any non-local deployment
  ## Do NOT define a `datasources:` block here. The chart already provisions
  ## Prometheus (isDefault) + Alertmanager through the datasource sidecar, which
  ## writes into an emptyDir at /etc/grafana/provisioning/datasources.
  ## A `datasources:` block is mounted from the grafana ConfigMap via subPath into
  ## that SAME directory, so Grafana loads both copies, sees Prometheus marked
  ## default twice, and crashloops with "Only one datasource per organization can
  ## be marked as default". The sidecar cannot see the subPath file, so the
  ## duplicate is invisible unless you inspect the grafana container's mounts.
  ## Loki's default is disabled in observability/loki-values.yaml instead.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

# ──────────────────────────────────────────────
# Disable components not needed locally
# ──────────────────────────────────────────────
kubeEtcd:
  enabled: false   # kind clusters don't expose etcd metrics by default
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# ──────────────────────────────────────────────
# Fix port 10250 conflict: node exporter uses hostNetwork,
# which conflicts with Prometheus operator's admission webhook
# on the same port. Disable hostNetwork on node exporter.
# Also fix kube-state-metrics: disable hostNetwork to avoid
# port conflicts and scheduling issues on control-plane node.
# ──────────────────────────────────────────────
prometheus-node-exporter:
  hostNetwork: false
  hostPort: 9100
  resources:
    requests:
      cpu: 100m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 100Mi

kubeStateMetrics:
  hostNetwork: false
  # Disable nodeSelector to allow scheduling on any worker node
  # (avoids port conflicts on control-plane node)
  nodeSelector: {}
  resources:
    requests:
      cpu: 100m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 100Mi
