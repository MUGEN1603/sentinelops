## kube-prometheus-stack values for SentinelOps
## Ref: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

# ──────────────────────────────────────────────
# Prometheus configuration
# ──────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 24h
    # Enable the remote-write receiver so the OTel Collector can push
    # kubeletstats metrics to Prometheus via /api/v1/write. The OTel
    # collector's `prometheusremotewrite` exporter depends on this.
    enableRemoteWriteReceiver: true
    # Pick up PrometheusRule objects in ALL namespaces
    ruleNamespaceSelector: {}
    ruleSelector:
      matchLabels:
        release: kube-prometheus
    # Scrape ServiceMonitors in all namespaces
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

# ──────────────────────────────────────────────
# AlertManager — webhook receiver to Incident Normalizer
# ──────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace", "pod"]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      receiver: sentinelops-webhook
    receivers:
      - name: sentinelops-webhook
        webhook_configs:
          # When running incident-normalizer locally via port-forward,
          # replace with the actual accessible URL or k8s service URL.
          - url: "http://host.docker.internal:8000/webhook"
            send_resolved: true

# ──────────────────────────────────────────────
# Grafana — enable with default dashboard
# ──────────────────────────────────────────────
# Grafana — enable with default dashboard
# ──────────────────────────────────────────────
# For production: create a Kubernetes Secret with the admin password and
# reference it via `grafana.admin.existingSecret` instead of hardcoding here.
# See infra/secrets.yaml (grafana-admin-credentials) for the Secret template.
grafana:
  enabled: true
  adminPassword: "sentinelops-admin"  # CHANGE THIS for any non-local deployment
  # Explicit datasource config to avoid "multiple default datasources" conflict
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://kube-prometheus-kube-prome-prometheus.observability.svc:9090
          access: proxy
          isDefault: true
          jsonData:
            httpMethod: POST
            timeInterval: 30s
        - name: Alertmanager
          type: alertmanager
          uid: alertmanager
          url: http://kube-prometheus-kube-prome-alertmanager.observability.svc:9093
          access: proxy
          isDefault: false
          jsonData:
            handleGrafanaManagedAlerts: false
            implementation: prometheus
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

# ──────────────────────────────────────────────
# Disable components not needed locally
# ──────────────────────────────────────────────
kubeEtcd:
  enabled: false   # kind clusters don't expose etcd metrics by default
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
